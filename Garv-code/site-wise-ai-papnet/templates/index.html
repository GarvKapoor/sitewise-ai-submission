<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiteWise AI — Autonomous Satellite Land Intelligence</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfeff',
                            400: '#22d3ee',
                            500: '#06b6d4',
                            600: '#0891b2',
                            900: '#164e63',
                        },
                        satellite: {
                            dark: '#090d16',
                            card: '#0f172a',
                            border: 'rgba(255, 255, 255, 0.08)',
                            accent: '#10b981'
                        }
                    },
                    fontFamily: {
                        mono: ['"DM Mono"', 'monospace', 'ui-monospace'],
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- React 18 & Babel Standalone -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #070b14;
            color: #f1f5f9;
            font-family: 'Inter', system-ui, sans-serif;
            overflow-x: hidden;
        }
        .grid-pattern {
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .glow-cyan {
            box-shadow: 0 0 35px -5px rgba(6, 182, 212, 0.25);
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-panel:hover {
            border-color: rgba(6, 182, 212, 0.3);
        }
        
        /* High-Tech Radar & Scanner Keyframes */
        @keyframes scanlineAnim {
            0% { top: 0%; opacity: 0.7; }
            50% { opacity: 1; }
            100% { top: 97%; opacity: 0.7; }
        }
        @keyframes scanlineFast {
            0% { top: 0%; opacity: 0.9; }
            100% { top: 97%; opacity: 0.9; }
        }
        @keyframes radarRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 0 0 15px rgba(6, 182, 212, 0.35);
            }
            50% {
                box-shadow: 0 0 30px rgba(168, 85, 247, 0.55);
            }
        }
        @keyframes shimmerLine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .scanning-laser-idle {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #22d3ee, #a855f7, #22d3ee, transparent);
            box-shadow: 0 0 10px 2px rgba(34, 211, 238, 0.8), 0 0 20px 4px rgba(168, 85, 247, 0.5);
            animation: scanlineAnim 3s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 20;
        }

        .scanning-laser-active {
            position: absolute;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #38bdf8, #ec4899, #a855f7, #38bdf8, transparent);
            box-shadow: 0 0 15px 4px rgba(56, 189, 248, 0.95), 0 0 30px 6px rgba(168, 85, 247, 0.8);
            animation: scanlineFast 1.2s linear infinite;
            pointer-events: none;
            z-index: 20;
        }

        .radar-sweep-cone {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0deg, transparent 270deg, rgba(34, 211, 238, 0.35) 360deg);
            animation: radarRotate 2.4s linear infinite;
            pointer-events: none;
            z-index: 15;
        }

        .hud-grid-overlay {
            background-image: 
                linear-gradient(rgba(34, 211, 238, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 211, 238, 0.08) 1px, transparent 1px);
            background-size: 16px 16px;
        }

        .reticle-corner {
            position: absolute;
            width: 12px;
            height: 12px;
            pointer-events: none;
            z-index: 14;
        }

        /* Custom subtle scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>
<body class="min-h-screen grid-pattern">

    <!-- React Root Container -->
    <div id="root"></div>

    <script>
        window.INITIAL_MODEL_ID = "{{ model_id }}";
        window.INITIAL_MODEL_NAME = "{{ model_name }}";
    </script>

    <!-- React App Script (Babel) -->
    <script type="text/babel">
    {% raw %}
        const { useState, useEffect, useRef, useMemo } = React;

        // 10 EuroSAT Land Classes with aesthetic metadata
        const CLASS_METADATA = {
            "Annual Crop Land": { icon: "🌾", color: "from-amber-500 to-yellow-600", desc: "Cultivated arable seasonal fields" },
            "Forest": { icon: "🌲", color: "from-emerald-500 to-green-700", desc: "High density canopy & woodland" },
            "Brushland or Shrubland": { icon: "🌿", color: "from-lime-500 to-emerald-600", desc: "Low woody vegetation & shrubs" },
            "Highway or Road": { icon: "🛣️", color: "from-slate-400 to-zinc-600", desc: "Paved transport network corridors" },
            "Industrial Buildings or Commercial Buildings": { icon: "🏭", color: "from-indigo-500 to-purple-700", desc: "Manufacturing facilities & commerce" },
            "Pasture Land": { icon: "🌱", color: "from-teal-400 to-emerald-500", desc: "Grassland for grazing & livestock" },
            "Permanent Crop Land": { icon: "🍇", color: "from-orange-500 to-amber-700", desc: "Orchards, vineyards & permanent crops" },
            "Residential Buildings or Homes or Apartments": { icon: "🏘️", color: "from-rose-500 to-red-600", desc: "Urban & suburban residential settlements" },
            "River": { icon: "🌊", color: "from-cyan-400 to-blue-600", desc: "Flowing freshwater waterbody" },
            "Lake or Sea": { icon: "⚓", color: "from-blue-600 to-indigo-800", desc: "Open maritime or deep basin water" }
        };

        const PRESET_SCENES = [
            { name: "Forest Canopy", icon: "🌲", id: "forest", sampleUrl: "/static/samples/forest.jpg" },
            { name: "Highway Corridor", icon: "🛣️", id: "highway", sampleUrl: "/static/samples/highway.jpg" },
            { name: "Deep Water / Lake", icon: "🌊", id: "water", sampleUrl: "/static/samples/water.jpg" },
            { name: "Crop Fields", icon: "🌾", id: "crops", sampleUrl: "/static/samples/crops.jpg" },
            { name: "Urban Buildings", icon: "🏢", id: "urban", sampleUrl: "/static/samples/urban.jpg" },
            { name: "Industrial Zone", icon: "🏭", id: "industrial", sampleUrl: "/static/samples/industrial.jpg" }
        ];

        const FACILITIES = [
            "Bank",
            "Hospital",
            "School",
            "Commercial Development",
            "Residential Development",
            "Industrial Plant",
            "Green Conservation"
        ];

        const FACILITY_TO_CATEGORY = {
            "Bank": "Commercial Development",
            "Hospital": "Healthcare Development",
            "School": "Educational Development",
            "Commercial Development": "Commercial Development",
            "Residential Development": "Residential Development",
            "Industrial Plant": "Industrial Development",
            "Green Conservation": "Green / Conservation"
        };

        function App() {
            // State: Default to PAPNet (Pattern-Affinitive Propagation)
            const [selectedModel, setSelectedModel] = useState("papnet");
            const [availableModels, setAvailableModels] = useState([]);
            const [selectedFacility, setSelectedFacility] = useState("Bank");
            const [imageFile, setImageFile] = useState(null);
            const [previewUrl, setPreviewUrl] = useState(null);
            const [isDragging, setIsDragging] = useState(false);
            const [loading, setLoading] = useState(false);
            const [scanPhase, setScanPhase] = useState("READY");
            const [scanProgress, setScanProgress] = useState(0);
            const [error, setError] = useState(null);
            const [results, setResults] = useState(null);
            const [activeTab, setActiveTab] = useState("overview"); // overview, probabilities, features, matrix
            const [apiLatency, setApiLatency] = useState(null);

            const fileInputRef = useRef(null);

            // Trigger instant facility re-evaluation when dropdown changes
            const triggerAnalysisForFacility = async (fac) => {
                if (!imageFile) return;
                const formData = new FormData();
                formData.append("image", imageFile);
                formData.append("facility", fac);
                formData.append("model_type", selectedModel);
                try {
                    const response = await fetch("/predict", {
                        method: "POST",
                        body: formData
                    });
                    const data = await response.json();
                    if (response.ok) {
                        setResults(data);
                    }
                } catch (err) {}
            };

            // Fetch available models
            useEffect(() => {
                fetch("/api/models")
                    .then(r => r.json())
                    .then(data => {
                        if (data && data.models) {
                            setAvailableModels(data.models);
                            // Ensure PAPNet is actively selected by default
                            if (data.models.some(m => m.id === "papnet" && m.available)) {
                                setSelectedModel("papnet");
                            } else if (data.active_model) {
                                setSelectedModel(data.active_model);
                            }
                        }
                    })
                    .catch(() => {});
            }, []);

            // Handle file selection
            const handleFile = (file) => {
                if (!file) return;
                if (!file.type.startsWith("image/")) {
                    setError("Please upload an image file (PNG, JPG, JPEG).");
                    return;
                }
                setError(null);
                setImageFile(file);
                const url = URL.createObjectURL(file);
                setPreviewUrl(url);
                setScanPhase("TILE LOADED · READY FOR INFERENCE");
                setScanProgress(0);
            };

            // Load authentic EuroSAT Sentinel-2 test tile from server and analyze immediately
            const handleSelectPreset = async (preset) => {
                setError(null);
                try {
                    const response = await fetch(preset.sampleUrl);
                    if (!response.ok) throw new Error("Could not load sample");
                    const blob = await response.blob();
                    const file = new File([blob], `${preset.id}.jpg`, { type: "image/jpeg" });
                    setPreviewUrl(preset.sampleUrl);
                    setImageFile(file);
                    setScanPhase("TILE LOADED · EXECUTING SCAN...");
                    setScanProgress(10);
                    runAnalysis(file, selectedFacility);
                } catch (e) {
                    console.error("Failed to load sample:", e);
                    setError("Could not load sample satellite tile.");
                }
            };

            // Run Analysis with Scanning Stage Telemetry
            const runAnalysis = async (fileOverride = null, facilityOverride = null) => {
                const targetFile = (fileOverride instanceof File || fileOverride instanceof Blob) ? fileOverride : imageFile;
                if (!targetFile) {
                    setError("Please select or drop a satellite image first.");
                    return;
                }
                const targetFac = (typeof facilityOverride === "string") ? facilityOverride : selectedFacility;

                setLoading(true);
                setError(null);
                setScanPhase("1/3 EXTRACTING 64×64 SPECTRAL BANDS (B2, B3, B4)...");
                setScanProgress(25);
                const startTime = performance.now();

                const t1 = setTimeout(() => {
                    setScanPhase("2/3 PROPAGATING PATTERN AFFINITIES THROUGH PAP MODULE...");
                    setScanProgress(65);
                }, 130);

                const t2 = setTimeout(() => {
                    setScanPhase("3/3 EVALUATING 8-CLASS DEVELOPMENT SUITABILITY...");
                    setScanProgress(90);
                }, 260);

                const formData = new FormData();
                formData.append("image", targetFile);
                formData.append("facility", targetFac);
                formData.append("model_type", selectedModel);

                try {
                    const response = await fetch("/predict", {
                        method: "POST",
                        body: formData
                    });

                    const data = await response.json();
                    if (!response.ok) {
                        throw new Error(data.error || "Analysis request failed.");
                    }

                    clearTimeout(t1);
                    clearTimeout(t2);
                    setScanProgress(100);
                    setScanPhase("NEURAL INFERENCE COMPLETE");

                    const elapsed = Math.round(performance.now() - startTime);
                    setApiLatency(elapsed);
                    setResults(data);
                } catch (err) {
                    clearTimeout(t1);
                    clearTimeout(t2);
                    setError(err.message || "Network error while connecting to model.");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div class="min-h-screen flex flex-col justify-between">
                    {/* TOP NAVBAR */}
                    <header class="border-b border-white/10 glass-panel sticky top-0 z-50">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            {/* Brand */}
                            <div class="flex items-center space-x-3">
                                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/25">
                                    <span class="text-white text-lg font-bold font-mono">🛰️</span>
                                </div>
                                <div>
                                    <div class="flex items-center space-x-2">
                                        <span class="text-lg font-extrabold tracking-tight text-white">SITEWISE</span>
                                        <span class="text-xs font-bold px-1.5 py-0.5 rounded bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 font-mono">REACT AI</span>
                                    </div>
                                    <p class="text-[10px] text-slate-400 uppercase tracking-widest font-mono">Land Intelligence Platform</p>
                                </div>
                            </div>

                            {/* Center Model Switcher */}
                            <div class="hidden md:flex items-center bg-slate-900/80 p-1 rounded-xl border border-white/10">
                                <button
                                    onClick={() => setSelectedModel("papnet")}
                                    class={`px-3 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center space-x-1.5 ${
                                        selectedModel === "papnet"
                                            ? "bg-gradient-to-r from-purple-500 to-indigo-600 text-white font-bold shadow-md shadow-purple-500/30"
                                            : "text-slate-400 hover:text-white"
                                    }`}
                                >
                                    <span>🧠 PAPNet (Pattern Affinity)</span>
                                    <span class="text-[10px] opacity-80">(91.67%)</span>
                                </button>
                                <button
                                    onClick={() => setSelectedModel("efficientnet")}
                                    class={`px-3 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center space-x-1.5 ${
                                        selectedModel === "efficientnet"
                                            ? "bg-cyan-500 text-slate-950 font-bold shadow-md shadow-cyan-500/20"
                                            : "text-slate-400 hover:text-white"
                                    }`}
                                >
                                    <span>⚡ EfficientNetB0</span>
                                    <span class="text-[10px] opacity-80">(94.96%)</span>
                                </button>
                            </div>

                            {/* System Status */}
                            <div class="flex items-center space-x-4">
                                <div class="hidden sm:flex items-center space-x-2 text-xs font-mono text-slate-400">
                                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                    <span>SYSTEM ONLINE</span>
                                    {apiLatency && <span class="text-cyan-400 font-semibold">• {apiLatency}ms</span>}
                                </div>
                                <a 
                                    href="https://github.com/tanganke/eurosat" 
                                    target="_blank" 
                                    class="text-xs text-slate-400 hover:text-white transition-colors border border-white/10 px-2.5 py-1 rounded-lg"
                                >
                                    EuroSAT
                                </a>
                            </div>
                        </div>
                    </header>

                    {/* HERO SUBHEADER & QUICK PRESET STRIP */}
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-2 w-full space-y-4">
                        <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                            <div>
                                <div class="inline-flex items-center space-x-2 text-xs font-mono text-cyan-400 bg-cyan-950/40 border border-cyan-800/50 px-3 py-1 rounded-full mb-2">
                                    <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                                    <span>SENTINEL-2 EARTH OBSERVATION</span>
                                    <span>•</span>
                                    <span>DUAL LAND &amp; WATER ENGINE</span>
                                </div>
                                <h1 class="text-2xl sm:text-3xl lg:text-4xl font-extrabold text-white tracking-tight">
                                    Satellite Land Classification <span class="bg-gradient-to-r from-cyan-400 via-teal-300 to-purple-400 bg-clip-text text-transparent">&amp; Site Suitability</span>
                                </h1>
                                <p class="text-slate-400 text-xs sm:text-sm max-w-2xl mt-1">
                                    Pattern-Affinitive Propagation (PAPNet) and deep convolutional neural intelligence for automated terrain zoning, physical visual telemetry, and facility site recommendation.
                                </p>
                            </div>
                        </div>

                        {/* Quick Presets Full-Width Strip */}
                        <div class="glass-panel p-3 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-3 border border-white/10">
                            <div class="flex items-center space-x-2 text-xs font-mono text-slate-300 shrink-0">
                                <span class="text-cyan-400 text-base">🛰️</span>
                                <span class="font-bold uppercase tracking-wider">QUICK SATELLITE PRESETS:</span>
                            </div>
                            <div class="flex flex-wrap gap-2">
                                {PRESET_SCENES.map((p, idx) => (
                                    <button
                                        key={idx}
                                        onClick={() => handleSelectPreset(p)}
                                        class="px-3 py-1.5 text-xs font-medium rounded-xl bg-slate-900/90 hover:bg-slate-800 hover:border-cyan-500/60 text-slate-200 border border-white/10 transition-all flex items-center space-x-2 group active:scale-95 shadow-sm"
                                        title={`Load sample ${p.name}`}
                                    >
                                        <span class="text-sm group-hover:scale-125 transition-transform">{p.icon}</span>
                                        <span class="font-semibold">{p.name}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* MAIN APPLICATION GRID */}
                    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 w-full flex-grow">
                        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">
                            
                            {/* LEFT COLUMN: UPLOAD & CONTROLS (5 cols) */}
                            <div class="lg:col-span-5 flex flex-col space-y-5">
                                {/* Upload Box */}
                                <div class="glass-panel rounded-2xl p-6 glow-cyan">
                                    <div class="flex items-center justify-between mb-4">
                                        <h2 class="text-sm font-bold uppercase tracking-wider font-mono text-slate-300 flex items-center space-x-2">
                                            <span class="w-2 h-2 rounded-full bg-cyan-400"></span>
                                            <span>01 SATELLITE IMAGERY SOURCE</span>
                                        </h2>
                                        <span class="text-xs text-cyan-400 font-mono bg-cyan-950/60 px-2 py-0.5 rounded border border-cyan-800/40">64×64 RGB</span>
                                    </div>

                                    {/* Drag & Drop Area with Cybernetic HUD & Laser Scanner */}
                                    <div
                                        onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
                                        onDragLeave={() => setIsDragging(false)}
                                        onDrop={(e) => {
                                            e.preventDefault();
                                            setIsDragging(false);
                                            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                                                handleFile(e.dataTransfer.files[0]);
                                            }
                                        }}
                                        onClick={() => fileInputRef.current && fileInputRef.current.click()}
                                        class={`relative border-2 border-dashed rounded-xl p-5 text-center cursor-pointer transition-all duration-200 overflow-hidden ${
                                            isDragging
                                                ? "border-cyan-400 bg-cyan-950/40"
                                                : previewUrl
                                                ? "border-cyan-500/40 bg-slate-900/60"
                                                : "border-slate-700 hover:border-slate-500 bg-slate-900/30"
                                        }`}
                                    >
                                        <input
                                            type="file"
                                            ref={fileInputRef}
                                            onChange={(e) => e.target.files && handleFile(e.target.files[0])}
                                            accept="image/png, image/jpeg, image/jpg"
                                            class="hidden"
                                        />

                                        {previewUrl ? (
                                            <div class="space-y-3">
                                                {/* Futuristic Satellite Reconnaissance Viewport */}
                                                <div class="relative w-48 h-48 sm:w-56 sm:h-56 mx-auto rounded-xl overflow-hidden border border-cyan-500/50 bg-slate-950 shadow-2xl group">
                                                    {/* Satellite Image */}
                                                    <img
                                                        src={previewUrl}
                                                        alt="Satellite Preview"
                                                        class={`w-full h-full object-cover transition-all duration-300 ${
                                                            loading ? "brightness-110 contrast-125 saturate-125" : ""
                                                        }`}
                                                    />

                                                    {/* Subtle HUD Grid Overlay */}
                                                    <div class="absolute inset-0 hud-grid-overlay opacity-35 pointer-events-none"></div>

                                                    {/* Animated Laser Scanning Beam */}
                                                    <div class={loading ? "scanning-laser-active" : "scanning-laser-idle"}></div>

                                                    {/* Radar Cone Sweep during active scan */}
                                                    {loading && <div class="radar-sweep-cone"></div>}

                                                    {/* 4 Corner Targeting Reticles */}
                                                    <div class="reticle-corner top-2 left-2 border-t-2 border-l-2 border-cyan-400"></div>
                                                    <div class="reticle-corner top-2 right-2 border-t-2 border-r-2 border-cyan-400"></div>
                                                    <div class="reticle-corner bottom-2 left-2 border-b-2 border-l-2 border-cyan-400"></div>
                                                    <div class="reticle-corner bottom-2 right-2 border-b-2 border-r-2 border-cyan-400"></div>

                                                    {/* Center Crosshair Lock */}
                                                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                                                        <div class="w-7 h-7 rounded-full border border-cyan-400/40 flex items-center justify-center">
                                                            <div class="w-1.5 h-1.5 rounded-full bg-cyan-400/80"></div>
                                                        </div>
                                                    </div>

                                                    {/* Telemetry Stamps */}
                                                    <div class="absolute top-2 left-3 text-[9px] font-mono text-cyan-300 font-bold bg-slate-950/80 px-1.5 py-0.5 rounded backdrop-blur border border-white/5 flex items-center space-x-1">
                                                        <span class={`w-1.5 h-1.5 rounded-full ${loading ? "bg-rose-400 animate-ping" : "bg-emerald-400"}`}></span>
                                                        <span>{loading ? "RADAR SCAN" : "SENSOR LOCK"}</span>
                                                    </div>
                                                    <div class="absolute top-2 right-3 text-[9px] font-mono text-slate-300 bg-slate-950/80 px-1.5 py-0.5 rounded backdrop-blur border border-white/5">
                                                        10m/px · 64×64
                                                    </div>
                                                    <div class="absolute bottom-2 left-3 text-[9px] font-mono text-slate-300 bg-slate-950/80 px-1.5 py-0.5 rounded backdrop-blur border border-white/5">
                                                        SENTINEL-2 MSI
                                                    </div>

                                            </div>
                                        )}

                                        {/* TAB 3: RECOMMENDATION MATRIX */}
                                        {activeTab === "matrix" && (
                                            <div class="glass-panel rounded-2xl p-5 space-y-3">
                                                <div class="flex items-center justify-between mb-2">
                                                    <h3 class="text-xs font-bold uppercase tracking-wider font-mono text-slate-300">
                                                        MODEL 3 RANKED DEVELOPMENT SUITABILITY MATRIX
                                                    </h3>
                                                    <span class="text-[11px] font-mono text-slate-500">8 Multi-criteria outputs</span>
                                                </div>

                                                <div class="space-y-2">
                                                    {(results.ranked_recommendations || []).map((rec, idx) => {
                                                        const isTop = idx === 0;
                                                        return (
                                                            <div
                                                                key={rec.name}
                                                                class={`p-3 rounded-xl border transition-all flex items-center justify-between ${
                                                                    isTop
                                                                        ? "bg-cyan-950/30 border-cyan-500/50"
                                                                        : "bg-slate-900/60 border-white/5"
                                                                }`}
                                                            >
                                                                <div class="flex items-center space-x-3">
                                                                    <div class={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold font-mono ${
                                                                        isTop ? "bg-cyan-400 text-slate-950" : "bg-slate-800 text-slate-400"
                                                                    }`}>
                                                                        #{rec.rank}
                                                                    </div>
                                                                    <span class={`text-sm ${isTop ? "font-bold text-white" : "font-medium text-slate-300"}`}>
                                                                        {rec.name}
                                                                    </span>
                                                                </div>

                                                                <div class="flex items-center space-x-3">
                                                                    <span class="text-xs font-mono font-bold text-emerald-400">
                                                                        {rec.score.toFixed(1)}%
                                                                    </span>
                                                                    {isTop && (
                                                                        <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">
                                                                            OPTIMAL
                                                                        </span>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>

                    {/* FOOTER */}
                    <footer class="border-t border-white/10 glass-panel py-4 mt-8">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs font-mono text-slate-500">
                            <div>SITEWISE AI &copy; 2026 — EUROSAT SATELLITE INTELLIGENCE</div>
                            <div class="flex items-center space-x-4">
                                <span>MODELS: EfficientNetB0 (94.96%) • PAPNet (91.67%)</span>
                                <span>•</span>
                                <span class="text-slate-400">REACT 18</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    {% endraw %}
    </script>
</body>
</html>
